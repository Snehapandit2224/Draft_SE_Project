{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Attrition Risk Factors for Employee ID: {{ employee_id }}</h3>
                </div>
                <div class="card-body">
                    <div id="risk-factors-list">
                        <p>Loading risk factors...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const employeeId = {{ employee_id }};
        const riskFactorsList = document.getElementById('risk-factors-list');

        fetch(`/ml/api/ml/risk-factors/${employeeId}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    riskFactorsList.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                    return;
                }
                if (data.risk_factors && data.risk_factors.length > 0) {
                    let html = '<ul class="list-group">';
                    data.risk_factors.forEach(factor => {
                        const [name, value] = factor;
                        const impact = value > 0 ? 'increases' : 'decreases';
                        const color = value > 0 ? 'text-danger' : 'text-success';
                        html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                                    ${name}
                                    <span class="${color}">Impact: ${impact} (${value.toFixed(4)})</span>
                                </li>`;
                    });
                    html += '</ul>';
                    riskFactorsList.innerHTML = html;
                } else {
                    riskFactorsList.innerHTML = '<div class="alert alert-info">No significant risk factors found for this employee.</div>';
                }
            })
            .catch(error => {
                console.error('Error fetching risk factors:', error);
                riskFactorsList.innerHTML = `<div class="alert alert-danger">Failed to load risk factors. Please try again later.</div>`;
            });
    });
</script>
{% endblock %}
