{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-10 offset-md-1">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">ML Model Dashboard</h3>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4>Latest Model Metrics</h4>
                        <button id="retrain-button" class="btn btn-primary">Retrain Model</button>
                    </div>
                    <div id="model-metrics-display">
                        <p>Loading model metrics...</p>
                    </div>

                    <h4 class="mt-4">Retraining Status</h4>
                    <div id="retraining-status-display">
                        <p>No retraining triggered recently.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modelMetricsDisplay = document.getElementById('model-metrics-display');
        const retrainingStatusDisplay = document.getElementById('retraining-status-display');
        const retrainButton = document.getElementById('retrain-button');

        function fetchMetrics() {
            // Fetch Model Metrics
            fetch('/ml/api/ml/model-metrics')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        modelMetricsDisplay.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                        return;
                    }
                    if (data.message) { // No metrics found
                        modelMetricsDisplay.innerHTML = `<div class="alert alert-info">${data.message}</div>`;
                    } else {
                        modelMetricsDisplay.innerHTML = `
                            <ul class="list-group">
                                <li class="list-group-item"><strong>Timestamp:</strong> ${new Date(data.timestamp).toLocaleString()}</li>
                                <li class="list-group-item"><strong>Accuracy:</strong> ${(data.accuracy * 100).toFixed(2)}%</li>
                                <li class="list-group-item"><strong>Precision:</strong> ${(data.precision * 100).toFixed(2)}%</li>
                                <li class="list-group-item"><strong>Recall:</strong> ${(data.recall * 100).toFixed(2)}%</li>
                            </ul>
                        `;
                        // Example of how you might display retraining status based on accuracy
                        if (data.accuracy < 0.80) { // Assuming 80% is the threshold
                            retrainingStatusDisplay.innerHTML = `<div class="alert alert-warning">Accuracy is below 80%. Model retraining has been automatically triggered.</div>`;
                        } else {
                            retrainingStatusDisplay.innerHTML = `<div class="alert alert-success">Model accuracy is healthy.</div>`;
                        }
                    }
                })
                .catch(error => {
                    console.error('Error fetching model metrics:', error);
                    modelMetricsDisplay.innerHTML = `<div class="alert alert-danger">Failed to load model metrics.</div>`;
                });
        }

        retrainButton.addEventListener('click', function() {
            retrainingStatusDisplay.innerHTML = `<div class="alert alert-info">Manual retraining triggered...</div>`;
            fetch('/ml/api/ml/retrain', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    retrainingStatusDisplay.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                    // Refresh metrics after a delay
                    setTimeout(fetchMetrics, 5000);
                })
                .catch(error => {
                    console.error('Error triggering retraining:', error);
                    retrainingStatusDisplay.innerHTML = `<div class="alert alert-danger">Failed to trigger retraining.</div>`;
                });
        });

        fetchMetrics();
    });
</script>
{% endblock %}
