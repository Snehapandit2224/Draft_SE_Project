{% extends "base.html" %}

{% block title %}ML Models{% endblock %}

{% block content %}
<div class="container">
    <h1>ML Models</h1>
    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Employee</th>
                <th>Attrition Risk</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="employee-risk-table-body">
        </tbody>
    </table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tableBody = document.getElementById('employee-risk-table-body');

        function updateTable(data) {
            tableBody.innerHTML = '';
            data.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.employee.first_name} ${item.employee.last_name}</td>
                        <td>${(item.attrition_probability * 100).toFixed(2)}%</td>
                        <td>
                            <a href="/ml/risk-factors/${item.employee.id}" class="btn btn-sm btn-primary">View Risk Factors</a>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        function fetchData() {
            fetch('/ml/api/predictions', { credentials: 'include' })
                .then(response => response.json())
                .then(data => {
                    updateTable(data);
                })
                .catch(err => console.error('Error fetching predictions:', err));
        }

        fetchData();
    });
</script>
{% endblock %}
